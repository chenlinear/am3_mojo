[build-system]
# `pip install .` / `uv build`: tools/mojo_build_backend.py compiles the module
# with the Mojo compiler from PyPI and builds a wheel (needs a C compiler for
# linking; installing the resulting wheel does not).
requires = ["mojo-compiler==1.2.0"]
build-backend = "mojo_build_backend"
backend-path = ["tools"]

[project]
name = "am3-mojo"
version = "0.2.0"
description = "am3_mojo: the AM3 lepto-hadronic interactions code written in Mojo, with the AM3 Python interface"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.0",
    "mojo-compiler==1.2.0",   # provides the Mojo runtime libraries the module loads
]

[dependency-groups]
dev = [
    "mojo==1.2.0",   # full Mojo toolchain for development (compiler, formatter, debugger)
    "pytest>=8",
    "matplotlib>=3.8",
    # building the original C++ AM3 as the reference (tests/reference)
    "cmake>=3.24",
    "ninja>=1.11",
    "pybind11>=2.12",
    # the scripts in tests/literature_checks/ and tools/triplet/
    "scipy>=1.18",
    "mpmath>=1.3",
    "sympy>=1.14",
    "antlr4-python3-runtime==4.11.*",   # sympy's LaTeX parser (literature_checks/common/latex.py)
    "vegas>=6.4",   # the triplet Monte Carlo
    "gvar>=13.1",   # vegas's random numbers and errors
]

[tool.uv]
package = false   # `uv sync` sets up the development environment; the module is built
                  # with `make build` (or installed with `pip install .`)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]   # `from support import ...`
# pytest's defaults, and tests/reference/work (the downloaded and built C++ reference)
norecursedirs = [".*", "*.egg", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "work"]
markers = ["reference: compares am3_mojo with the original C++ AM3 (needs `make reference`)"]
